<script>
  // nav background on scroll
  var nav = document.getElementById('nav');
  var onScroll = function(){ nav.classList.toggle('scrolled', window.scrollY > 40); };
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  var burger = document.getElementById('burger');
  burger.addEventListener('click', function(){
    var open = nav.classList.toggle('open');
    burger.setAttribute('aria-expanded', open);
  });
  document.getElementById('navLinks').addEventListener('click', function(e){
    if (e.target.tagName === 'A') { nav.classList.remove('open'); burger.setAttribute('aria-expanded','false'); }
  });

  var target = new Date(2026, 10, 27, 17, 0, 0).getTime();
  var pads = function(n){ return String(n).padStart(2,'0'); };
  var tick = function(){
    var diff = Math.max(0, target - Date.now());
    var d = Math.floor(diff / 86400000);
    var h = Math.floor(diff / 3600000) % 24;
    var m = Math.floor(diff / 60000) % 60;
    var s = Math.floor(diff / 1000) % 60;
    document.querySelectorAll('[data-d]').forEach(function(el){ el.textContent = pads(d); });
    document.querySelectorAll('[data-h]').forEach(function(el){ el.textContent = pads(h); });
    document.querySelectorAll('[data-m]').forEach(function(el){ el.textContent = pads(m); });
    document.querySelectorAll('[data-s]').forEach(function(el){ el.textContent = pads(s); });
  };
  tick();
  setInterval(tick, 1000);

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, {threshold:.15});
  document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });

  // Replace this URL after deployment on Render.
  var RSVP_API_URL = 'https://your-render-service-name.onrender.com/api/rsvp';

  var form = document.getElementById('rsvpForm');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (!form.reportValidity()) return;

    var name = document.getElementById('name').value.trim();
    var email = document.getElementById('email').value.trim();
    var seats = document.getElementById('seats').value;

    var button = form.querySelector('button[type="submit"]');
    var originalText = button.textContent;
    button.disabled = true;
    button.textContent = 'Sending...';

    fetch(RSVP_API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        name: name,
        email: email,
        seats: seats,
        source: 'website'
      })
    })
      .then(function(response){
        return response.json().then(function(data){
          if (!response.ok) throw new Error(data.error || 'Unable to submit RSVP.');
          return data;
        });
      })
      .then(function(){
        document.getElementById('successTitle').textContent = 'You’re on the list, ' + (name.split(' ')[0] || 'friend') + '!';
        document.getElementById('successMsg').textContent = seats + (seats === '1' ? ' seat is' : ' seats are') + ' reserved — see you at AH Hotel, Friday 27th November 2026, 5:00 PM.';
        form.classList.add('done');
      })
      .catch(function(error){
        console.error(error);
        document.getElementById('successTitle').textContent = 'Thanks, ' + (name.split(' ')[0] || 'friend') + '!';
        document.getElementById('successMsg').textContent = 'Your reservation was received locally, but the email notification could not be sent. Please contact the organiser directly if needed.';
        form.classList.add('done');
      })
      .finally(function(){
        button.disabled = false;
        button.textContent = originalText;
      });
  });

  (function(){
    var fab = document.getElementById('botFab');
    var panel = document.getElementById('botPanel');
    var msgs = document.getElementById('botMsgs');
    var chips = document.getElementById('botChips');
    var form = document.getElementById('botForm');
    var input = document.getElementById('botText');
    var greeted = false;
    var KB = [
      {re:/(hello|hi|hey|good (day|morning|afternoon|evening)|greet)/i, a:"Beep boop. Greetings, human. Ask me about the book, the launch event, reservations or the help line."},
      {re:/(date|time|when|schedule|what day|month|november)/i, a:"The official book launch holds on Friday, 27th November 2026 at 5:00 PM. Beep — punctuality is robot-approved."},
      {re:/(venue|where|location|address|hotel|direction|map)/i, a:"The launch takes place at AH Hotel. Need directions? The help line can guide you: +233 53 609 0597."},
      {re:/(rsvp|reserve|seat|ticket|register|attend|free|cost|price|pay|entry)/i, a:"Reservations are free. Use the “Reserve Your Seat” form on this page — beep — and your seat will be held for you."},
      {re:/(contact|call|phone|help|helpline|whatsapp|reach|support)/i, a:"Help line: +233 53 609 0597. A human answers faster than my processors."},
      {re:/(author|who|wrote|writer|felicia|benefo|speaker)/i, a:"The author is Felicia Awura Ama Twumwaa Odei Benefo — scholar, researcher, entrepreneur and finance professional."},
      {re:/(book|thesis|transformation|about|title|read|content|chapter|topic)/i, a:"“From Thesis to Transformation” shows how to turn academic research into a book, a brand and a career. It invites researchers to think beyond completion and into impact."}
    ];
    var FALLBACK = "Beep… my circuits lack that answer. Try a chip below, or call the help line: +233 53 609 0597.";
    var CHIP_LIST = ["Date & time", "Venue", "Reserve a seat", "About the book", "Help line"];

    function add(who, text){
      var d = document.createElement('div');
      d.className = 'msg ' + who;
      d.textContent = text;
      msgs.appendChild(d);
      msgs.scrollTop = msgs.scrollHeight;
      return d;
    }
    function bot(text){
      var t = add('bot', '');
      t.classList.add('typing');
      t.innerHTML = '<span></span><span></span><span></span>';
      setTimeout(function(){
        t.classList.remove('typing');
        t.textContent = text;
        msgs.scrollTop = msgs.scrollHeight;
      }, 550 + Math.random() * 550);
    }
    function answer(q){
      for (var i = 0; i < KB.length; i++) if (KB[i].re.test(q)) return KB[i].a;
      return FALLBACK;
    }
    function ask(q){
      add('user', q);
      bot(answer(q));
    }
    CHIP_LIST.forEach(function(label){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = label;
      b.addEventListener('click', function(){ ask(label); });
      chips.appendChild(b);
    });
    function open(){
      panel.classList.add('open');
      fab.setAttribute('aria-expanded', 'true');
      if (!greeted) {
        greeted = true;
        bot("Beep… boop. I am Felicia, the robotic launch assistant for this book launch. How may I assist your transformation?");
      }
      input.focus();
    }
    function close(){
      panel.classList.remove('open');
      fab.setAttribute('aria-expanded', 'false');
    }
    fab.addEventListener('click', function(){ panel.classList.contains('open') ? close() : open(); });
    fab.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fab.click(); } });
    document.getElementById('botClose').addEventListener('click', close);
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var q = input.value.trim();
      if (!q) return;
      input.value = '';
      ask(q);
    });
  })();
</script>
